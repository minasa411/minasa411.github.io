<script>
const form=document.getElementById('unlock');
const input=document.getElementById('password');
const status=document.getElementById('status');
const button=form.querySelector('button');
const fromBase64=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
const payload=JSON.parse(document.getElementById('encrypted-case').textContent);
const sessionKey='portfolio-case-key:'+payload.salt;
async function showCaseStudy(key){
 const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromBase64(payload.iv)},key,fromBase64(payload.data));
 const bundle=JSON.parse(new TextDecoder().decode(clear));
 try{
  const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));
  sessionStorage.setItem(sessionKey,btoa(String.fromCharCode(...raw)));
 }catch{}
 input.value='';
 const unlocked=new DOMParser().parseFromString(bundle.html,'text/html');
 document.head.replaceWith(document.importNode(unlocked.head,true));
 document.body.replaceWith(document.importNode(unlocked.body,true));
 document.querySelector('h1')?.setAttribute('tabindex','-1');document.querySelector('h1')?.focus();
}
async function restoreSession(){
 if(!window.crypto?.subtle)return;
 let saved;
 try{saved=sessionStorage.getItem(sessionKey);}catch{return;}
 if(!saved)return;
 const gate=document.querySelector('main');
 if(gate)gate.style.visibility='hidden';
 button.disabled=true;button.textContent='Unlocking…';
 try{
  const key=await crypto.subtle.importKey('raw',fromBase64(saved),{name:'AES-GCM'},true,['decrypt']);
  await showCaseStudy(key);
 }catch{
  try{sessionStorage.removeItem(sessionKey);}catch{}
  if(gate)gate.style.visibility='visible';
  button.disabled=false;button.textContent='View case study';
 }
}
form.addEventListener('submit',async event=>{
 event.preventDefault(); status.textContent='';input.removeAttribute('aria-invalid');
 if(!window.crypto?.subtle){status.textContent='Please open this page using HTTPS to unlock it.';return;}
 button.disabled=true;button.textContent='Unlocking…';
 try{
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(input.value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromBase64(payload.salt),iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},true,['decrypt']);
  await showCaseStudy(key);
 }catch{status.textContent='Incorrect password. Please try again.';input.setAttribute('aria-invalid','true');input.focus();button.disabled=false;button.textContent='View case study';}
});
async function unlockFromLink(){
 const params=new URLSearchParams(window.location.hash.slice(1));
 const token=params.get('access');
 if(!token){await restoreSession();return;}
 // Remove the secret from the visible URL and current history entry.
 history.replaceState(null,'',window.location.pathname+window.location.search);
 const gate=document.querySelector('main');
 if(gate)gate.style.visibility='hidden';
 button.disabled=true;button.textContent='Unlocking…';
 try{
  if(!window.crypto?.subtle)throw new Error('Secure context required');
  if(!/^[A-Za-z0-9_-]{43}$/.test(token))throw new Error('Invalid access token');
  const key=await crypto.subtle.importKey('raw',fromBase64(token.replace(/-/g,'+').replace(/_/g,'/')+'='),{name:'AES-GCM'},true,['decrypt']);
  await showCaseStudy(key);
 }catch{
  if(gate)gate.style.visibility='visible';
  button.disabled=false;button.textContent='View case study';
  status.textContent='This access link could not unlock the case study. Please enter the password.';
 }
}
unlockFromLink().finally(()=>{const main=document.querySelector('main');if(main){main.hidden=false;main.style.visibility='visible';}});
</script></body></html>
